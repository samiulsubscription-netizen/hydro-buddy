name: Build Hydro Buddy Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HydroBuddy --add-data "mascot_male.gif;." --add-data "mascot_female.gif;." hydro_buddy.py

      - name: Upload Hydro Buddy EXE
        uses: actions/upload-artifact@v4
        with:
          name: HydroBuddy-Windows
          path: dist/HydroBuddy.exe
